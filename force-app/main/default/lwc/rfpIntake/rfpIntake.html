<template>
    <lightning-card title="New Opportunity from RFP" icon-name="standard:document_reference">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <h2>{error}</h2>
                </div>
            </template>

            <template if:true={isInput}>
                <div
                    class={dropzoneClass}
                    ondragover={handleDragOver}
                    ondragenter={handleDragOver}
                    ondragleave={handleDragLeave}
                    ondrop={handleDrop}
                >
                    <lightning-icon icon-name="utility:upload" size="small" class="slds-m-bottom_x-small">
                    </lightning-icon>
                    <p class="slds-text-heading_small">Drop the client RFP or brief here</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                        PDF, Excel, CSV, or text. Einstein drafts the opportunity and you review it before it's created.
                    </p>
                    <lightning-button label="Browse files" icon-name="utility:search" onclick={handleBrowse}>
                    </lightning-button>
                    <input
                        class="file-input"
                        type="file"
                        accept=".pdf,.xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt,.eml,.md"
                        onchange={handleFileChange}
                    />
                </div>

                <div class="slds-m-top_small">
                    <lightning-button variant="base" label={pasteToggleLabel} onclick={togglePaste}></lightning-button>
                </div>
                <template if:true={showPaste}>
                    <lightning-textarea
                        label="RFP text"
                        placeholder="Paste the agency email or brief…"
                        value={pastedText}
                        onchange={handlePasteChange}
                        class="paste-box"
                    >
                    </lightning-textarea>
                    <lightning-button
                        variant="brand"
                        label="Read pasted text"
                        onclick={handleReadPasted}
                        disabled={pasteDisabled}
                        class="slds-m-top_x-small"
                    >
                    </lightning-button>
                </template>
            </template>

            <template if:true={isReading}>
                <div class="reading">
                    <lightning-spinner alternative-text="Working" size="small" variant="brand"></lightning-spinner>
                    <p class="slds-text-body_regular slds-m-top_large">{statusText}</p>
                </div>
            </template>

            <template if:true={isReview}>
                <div class="summary slds-m-bottom_small">
                    <div>
                        <p class="slds-text-title_caps">Source</p>
                        <p class="slds-truncate" title={sourceLabel}>{sourceLabel}</p>
                    </div>
                    <div>
                        <p class="slds-text-title_caps">Advertiser in RFP</p>
                        <p>{advertiserName}</p>
                    </div>
                    <div>
                        <p class="slds-text-title_caps">RFP details found</p>
                        <p>{foundCount} of {detailCount}</p>
                    </div>
                </div>

                <template if:true={hasWarnings}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                        <ul>
                            <template for:each={warnings} for:item="warning">
                                <li key={warning}>{warning}</li>
                            </template>
                        </ul>
                    </div>
                </template>

                <h3 class="slds-text-heading_small slds-m-bottom_x-small">New opportunity</h3>
                <div class="rows">
                    <template for:each={coreRows} for:item="row">
                        <c-rfp-intake-field key={row.fieldApiName} row={row} onrowchange={handleRowChange}>
                        </c-rfp-intake-field>
                    </template>
                </div>
                <template if:true={showCreateAccount}>
                    <div class="slds-m-top_x-small">
                        <lightning-input
                            type="checkbox"
                            label={createAccountLabel}
                            checked={createAccount}
                            onchange={handleCreateAccountChange}
                        >
                        </lightning-input>
                    </div>
                </template>

                <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">RFP details</h3>
                <div class="rows">
                    <template for:each={detailRows} for:item="row">
                        <c-rfp-intake-field key={row.fieldApiName} row={row} onrowchange={handleRowChange}>
                        </c-rfp-intake-field>
                    </template>
                </div>

                <template if:true={canAttach}>
                    <div class="slds-m-top_small">
                        <lightning-input
                            type="checkbox"
                            label={attachLabel}
                            checked={attachFile}
                            onchange={handleAttachChange}
                        >
                        </lightning-input>
                    </div>
                </template>

                <div class="actions slds-m-top_medium">
                    <p class="slds-text-body_small slds-text-color_weak">{createHint}</p>
                    <lightning-button label="Start over" onclick={handleStartOver}></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Create Opportunity"
                        onclick={handleCreate}
                        disabled={createDisabled}
                    >
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
